# Use a fully pulled, verified immutable image digest. This service is private;
# Nginx forwards /studio/ while /api/v1 and /v1 stay with Sub2API.
services:
  canvas:
    image: ${CANVAS_IMAGE:?set an immutable canvas image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 100
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=32m,uid=1000,gid=1000
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
