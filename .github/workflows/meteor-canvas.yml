name: Meteor canvas pilot

on:
  push:
    branches: ["meteor/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meteor-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install exact dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck all frontend sources
        working-directory: web
        run: bun run typecheck
      - name: Pilot route boundaries
        working-directory: web
        run: bun run test:pilot

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable image tag
        id: tag
        run: echo "image=ghcr.io/meteor21c/canvas:pilot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push frontend-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=meteor-canvas
          cache-to: type=gha,mode=max,scope=meteor-canvas
      - name: Smoke test the published image with production limits
        env:
          PILOT_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker pull "$PILOT_IMAGE"
          docker run -d --name meteor-canvas-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 512m --cpus 0.5 --pids-limit 100 --tmpfs /tmp:size=32m,mode=1777 --tmpfs /app/.next/cache:size=32m,uid=1000,gid=1000 -p 127.0.0.1:3010:3000 "$PILOT_IMAGE"
          trap 'docker stop meteor-canvas-smoke > /dev/null' EXIT
          node web/tests/pilot-runtime-smoke.mjs
