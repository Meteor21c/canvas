name: Meteor canvas v0.8.2

on:
  push:
    branches: ["meteor/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meteor-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Exact frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck and API boundaries
        working-directory: web
        run: bun run typecheck && bun run test:meteor

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable image tag
        id: tag
        run: echo "image=ghcr.io/meteor21c/canvas:meteor-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build full Next and Go image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=meteor-canvas-v082
          cache-to: type=gha,mode=max,scope=meteor-canvas-v082
      - name: Runtime smoke with mocked main API and production limits
        env:
          CANVAS_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          node web/tests/meteor-mock-main.mjs &
          MOCK_PID=$!
          docker pull "$CANVAS_IMAGE"
          sudo install -d -m 700 -o 1000 -g 1000 "$RUNNER_TEMP/canvas-data"
          docker run -d --name meteor-canvas-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --memory 768m --cpus 0.75 --pids-limit 140 --add-host host.docker.internal:host-gateway -e METEOR_API_BASE=http://host.docker.internal:3000 --tmpfs /tmp:size=48m,mode=1777 --tmpfs /app/web/.next/cache:size=32m,uid=1000,gid=1000 -v "$RUNNER_TEMP/canvas-data:/app/data" -p 127.0.0.1:3010:3000 "$CANVAS_IMAGE"
          trap 'docker logs --tail 30 meteor-canvas-smoke; docker stop meteor-canvas-smoke > /dev/null; kill "$MOCK_PID"' EXIT
          node web/tests/meteor-runtime-smoke.mjs
